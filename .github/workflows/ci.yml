name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096M
    -Dorg.gradle.daemon=false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Run static checks
        run: mise run check
      - name: Run tests
        run: mise run test
      - name: Build debug APKs
        run: mise run build
      - name: Generate coverage
        run: ./gradlew koverXmlReport
      - name: Collect coverage reports
        id: coverage-reports
        shell: bash
        run: |
          files=$(find . -path '*/build/reports/kover/report.xml' -type f -size +0c -print | sort | paste -sd, -)
          if [[ -z "$files" ]]; then
            echo 'No non-empty Kover XML reports were generated.' >&2
            exit 1
          fi
          printf 'files=%s\n' "$files" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.files }}
          disable_search: true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            app/android/build/foss-classpath/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Run iOS simulator tests
        run: mise run test-ios
      - name: Build iOS simulator app
        run: mise run build-ios
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 7
