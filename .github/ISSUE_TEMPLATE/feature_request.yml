name: Feature request
description: Propose an improvement
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions for completion.
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search and stops
        - Routes and schedules
        - Map
        - Live arrivals
        - Offline data
        - Settings
        - Accessibility
        - Build and tooling
        - Other
    validations:
      required: true
  - type: checkboxes
    id: offline
    attributes:
      label: Offline
      options:
        - label: This should work without a connection
