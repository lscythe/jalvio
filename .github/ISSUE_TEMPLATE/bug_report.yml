name: Bug report
description: Report a reproducible problem
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a new report. Report security vulnerabilities privately as described in the security policy.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest reliable reproduction.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Google Play (playstore)
        - FOSS with crash reporting (fossFull)
        - FOSS (foss)
        - App Store
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity
      description: Was the device online when the problem happened?
      options:
        - Online
        - Offline
        - Unstable or switching
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 9, Android 17
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal data before posting.
      render: text
